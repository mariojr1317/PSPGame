name: Compilar Homebrew PSP
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container: pspdev/pspdev:latest
    steps:
      - uses: actions/checkout@v4

      - name: Compilar EBOOT.PBP
        run: make

      - name: Subir Juego
        uses: actions/upload-artifact@v4
        with:
          name: ArbitroPSP_PBP
          path: EBOOT.PBP
